<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, mi nena 💌</title>
<meta name="description" content="Una carta para ti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-mist:#e3f4fc;
    --sky:#a9d7f2;
    --sky-deep:#6fb8e6;
    --sky-deeper:#4fa2da;
    --aqua-mist:#d8f5ef;
    --lilac-mist:#ecdff8;
    --lilac:#cdaeeb;
    --pearl:#fffdfb;
    --blush:#ffd3e6;
    --gold:#f6d98c;
    --ink:#3d3557;
    --ink-soft:#5c5478;
    --vh: 1vh;
    --mx: 50%;
    --my: 40%;
    --hue: 0deg;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    overflow:hidden;
    background:var(--pearl);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    font-family:'Jost', sans-serif;
    color:var(--ink);
  }
  button{ font-family:inherit; }

  /* ============ SCENE (single 100vh screen, no page scroll) ============ */
  .scene{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    height:calc(var(--vh, 1vh) * 100);
    overflow:hidden;
    isolation:isolate;
  }

  /* ============ BACKGROUND ============ */
  .bg{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 20%, var(--sky-mist), transparent 55%),
      radial-gradient(circle at 80% 15%, var(--lilac-mist), transparent 50%),
      radial-gradient(circle at 50% 90%, var(--sky), transparent 60%),
      linear-gradient(135deg, var(--sky-mist) 0%, var(--pearl) 45%, var(--lilac-mist) 100%);
    background-size: 160% 160%, 160% 160%, 160% 160%, 220% 220%;
    animation: drift 26s ease-in-out infinite alternate;
    filter: hue-rotate(var(--hue));
    transition: filter .4s ease-out;
  }
  @keyframes drift{
    0%{ background-position: 0% 0%, 100% 0%, 50% 100%, 0% 0%; }
    100%{ background-position: 20% 30%, 80% 30%, 40% 70%, 100% 100%; }
  }

  .bg-texture{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.4px),
      radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px);
    background-size: 46px 46px, 74px 74px;
    background-position: 0 0, 23px 30px;
    mix-blend-mode: soft-light;
  }

  .cursor-light{
    position:absolute; inset:0;
    background: radial-gradient(circle 380px at var(--mx) var(--my), rgba(255,255,255,.55), rgba(169,215,242,.18) 45%, transparent 70%);
    mix-blend-mode: soft-light;
    transition: background .05s linear;
    pointer-events:none;
  }

  .clouds{ position:absolute; inset:0; pointer-events:none; }
  .cloud{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,0) 70%);
    filter: blur(6px);
    opacity:.55;
    animation: floatCloud linear infinite;
  }
  @keyframes floatCloud{
    0%{ transform: translateX(-6vw); }
    50%{ transform: translateX(6vw); }
    100%{ transform: translateX(-6vw); }
  }

  #particle-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  .floating-hearts{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .fheart{
    position:absolute;
    bottom:-10%;
    color: var(--lilac);
    opacity:.35;
    animation-name: riseHeart;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }
  @keyframes riseHeart{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.4; }
    90%{ opacity:.25; }
    100%{ transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(20deg); opacity:0; }
  }

  /* ============ ENVELOPE ============ */
  .envelope-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap: clamp(14px, 2.4vh, 26px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .envelope-wrap.hidden{
    opacity:0; transform: scale(.85);
    pointer-events:none;
  }

  .hint{
    font-family:'Parisienne', cursive;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    color: var(--ink-soft);
    letter-spacing:.02em;
    animation: pulseHint 2.4s ease-in-out infinite;
    text-align:center;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:.55; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-3px); }
  }

  .envelope{
    position:relative;
    width: min(45vw, 480px);
    aspect-ratio: 3 / 2;
    cursor:pointer;
    perspective: 1200px;
    filter: drop-shadow(0 18px 34px rgba(93,109,163,.35));
    transition: transform .35s ease;
  }
  @media (max-width: 720px){
    .envelope{ width: 76vw; }
  }
  .envelope:hover{ transform: translateY(-4px); }
  .envelope:focus-visible{ outline: 3px solid var(--sky-deep); outline-offset: 6px; border-radius: 10px; }

  .envelope-glow{
    position:absolute;
    top:50%; left:50%;
    width:130%; height:150%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(169,215,242,.55) 0%, rgba(205,174,235,.35) 45%, transparent 72%);
    filter: blur(30px);
    z-index:0;
    animation: glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.75; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.05); }
  }

  .env-body{
    position:absolute; inset:0;
    border-radius: 12px;
    background:
      linear-gradient(115deg, rgba(255,255,255,.55) 0%, transparent 30%),
      linear-gradient(155deg, var(--sky) 0%, var(--sky-deep) 78%, #6bb3e0 100%);
    border: 1.5px solid rgba(255,255,255,.8);
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.55),
      0 0 0 5px rgba(255,255,255,.18),
      inset 0 0 34px rgba(255,255,255,.28),
      0 24px 44px rgba(93,109,163,.4),
      0 6px 14px rgba(93,109,163,.22);
  }

  /* subtle inner fold seams, visible against both the paper and the body */
  .env-seam{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
    background:
      linear-gradient(228deg, rgba(61,53,87,.10) 0%, transparent 42%),
      linear-gradient(312deg, rgba(61,53,87,.10) 0%, transparent 42%);
    border-radius: 12px;
    overflow:hidden;
  }

  .env-letter-peek{
    position:absolute;
    left:6%; right:6%; top:3%;
    height:64%;
    background: linear-gradient(180deg, #fff, var(--pearl));
    border-radius: 4px 4px 0 0;
    box-shadow: 0 -3px 10px rgba(93,109,163,.18), 0 0 0 1px rgba(93,109,163,.05);
    transform: translateY(0%);
    transition: transform .7s cubic-bezier(.2,.8,.3,1) .35s;
    z-index:1;
  }
  .env-letter-peek::before{
    content:"";
    position:absolute; left:14%; right:14%; top:14%;
    height:3px;
    background: linear-gradient(90deg, transparent, rgba(93,109,163,.18), transparent);
  }
  .env-letter-peek::after{
    content:"";
    position:absolute; left:14%; right:14%; top:24%;
    height:3px;
    background: linear-gradient(90deg, transparent, rgba(93,109,163,.12), transparent);
  }
  .envelope.opening .env-letter-peek{
    transform: translateY(-50%);
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:62%;
    background: linear-gradient(160deg, var(--sky-deep) 0%, var(--sky) 55%, var(--sky-deep) 100%);
    clip-path: polygon(0 0, 100% 0, 50% 92%);
    -webkit-clip-path: polygon(0 0, 100% 0, 50% 92%);
    transform-origin: top center;
    transition: transform .8s cubic-bezier(.5,0,.2,1);
    transform-style: preserve-3d;
    z-index:3;
    border-top: 1.5px solid rgba(255,255,255,.85);
  }
  .env-flap::before{
    content:"";
    position:absolute; inset:0;
    clip-path: polygon(0 0, 100% 0, 50% 92%);
    -webkit-clip-path: polygon(0 0, 100% 0, 50% 92%);
    background: linear-gradient(165deg, rgba(255,255,255,.45) 0%, transparent 32%, rgba(46,40,71,.12) 100%);
  }
  .env-flap::after{
    content:"";
    position:absolute; left:0; right:0; top:0;
    height:2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
  }
  .envelope.opening .env-flap{
    transform: rotateX(180deg);
    z-index:1;
  }

  .seal{
    position:absolute;
    top: 30%; left:50%;
    width: clamp(36px, 8.5vw, 56px);
    height: clamp(36px, 8.5vw, 56px);
    transform: translate(-50%,-50%);
    z-index:4;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 4px 8px rgba(93,109,163,.5));
    transition: opacity .35s ease .05s, transform .35s ease .05s;
  }
  .seal-ribbon{
    position:absolute;
    top:calc(50% - 1px); left:50%;
    width:4px; height:26px;
    background: linear-gradient(180deg, var(--blush), rgba(255,211,230,0));
    transform: translateX(-50%);
    border-radius: 2px;
    z-index:3;
  }
  .seal-half{
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #fff 0%, var(--blush) 38%, #e18aae 72%, #b85c81 100%);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.55),
      inset 0 -4px 7px rgba(120,42,72,.4),
      0 3px 8px rgba(93,109,163,.4);
    display:flex; align-items:center; justify-content:center;
    color:#8a3358;
    font-size: 1.15em;
    text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(110,30,58,.4);
    transition: transform .55s cubic-bezier(.4,0,.2,1), opacity .55s ease;
  }
  .seal-half.left{ clip-path: inset(0 50% 0 0); }
  .seal-half.right{ clip-path: inset(0 0 0 50%); }
  .envelope.opening .seal-half.left{ transform: translate(-14px,-6px) rotate(-18deg); opacity:0; }
  .envelope.opening .seal-half.right{ transform: translate(14px,-6px) rotate(18deg); opacity:0; }
  .envelope.opening .seal-ribbon{ opacity:0; transition: opacity .3s ease; }

  /* ============ LETTER CARD ============ */
  .letter-card{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%) scale(.25);
    width: min(90vw, 620px);
    height: min(88vh, 720px);
    background: var(--pearl);
    border-radius: 16px;
    box-shadow: 0 30px 60px rgba(93,109,163,.4), 0 0 0 1px rgba(255,255,255,.6) inset;
    opacity:0;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    padding: clamp(16px, 3vh, 30px) clamp(16px, 4vw, 34px) clamp(14px, 2.4vh, 22px);
    transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
    z-index:5;
  }
  .letter-card.visible{
    transform: translate(-50%,-50%) scale(1);
    opacity:1;
    pointer-events:auto;
  }

  .letter-card::before,
  .letter-card::after{
    content:"";
    position:absolute;
    width: clamp(46px, 9vw, 74px);
    height: clamp(46px, 9vw, 74px);
    border-color: var(--sky-deep);
    opacity:.4;
    pointer-events:none;
  }
  .letter-card::before{
    top:10px; left:10px;
    border-top: 2px solid var(--sky-deep);
    border-left: 2px solid var(--sky-deep);
    border-radius: 14px 0 0 0;
  }
  .letter-card::after{
    bottom:10px; right:10px;
    border-bottom: 2px solid var(--lilac);
    border-right: 2px solid var(--lilac);
    border-radius: 0 0 14px 0;
  }

  .ribbon{
    position:absolute;
    top:-2px; left: 22px;
    background: linear-gradient(135deg, var(--sky-deep), var(--lilac));
    color:#fff;
    font-family:'Parisienne', cursive;
    font-size: clamp(.95rem, 2vw, 1.2rem);
    padding: 8px 18px 12px;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    -webkit-clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    box-shadow: 0 6px 10px rgba(93,109,163,.3);
  }

  .close-btn{
    position:absolute;
    top: 12px; right: 12px;
    width: 34px; height:34px;
    border-radius:50%;
    border:none;
    background: rgba(169,215,242,.35);
    color: var(--ink);
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .25s ease, transform .25s ease;
    z-index:2;
  }
  .close-btn:hover{ background: var(--blush); transform: rotate(90deg); }
  .close-btn:focus-visible{ outline:2px solid var(--sky-deep); outline-offset:2px; }

  .letter-content{
    margin-top: clamp(28px, 5vh, 40px);
    flex: 1 1 auto;
    overflow-y:auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--lilac) transparent;
  }
  .letter-content::-webkit-scrollbar{ width:5px; }
  .letter-content::-webkit-scrollbar-thumb{ background: var(--lilac); border-radius:6px; }

  .letter-text{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(.98rem, 1.9vw, 1.22rem);
    line-height:1.6;
    color: var(--ink);
  }
  .letter-text p{
    margin: 0 0 .85em 0;
  }
  .caret{
    display:inline-block;
    width: .5em;
    color: var(--sky-deep);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .actions{
    display:flex;
    gap: clamp(10px, 1.6vw, 16px);
    justify-content:center;
    margin-top: clamp(12px, 2vh, 18px);
    opacity:0;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .actions.visible{ opacity:1; transform:translateY(0); }
  @media (max-width: 560px){
    .actions{ flex-direction:column; align-items:stretch; }
  }

  .glass-btn{
    flex:1;
    padding: clamp(10px,1.6vh,14px) clamp(14px, 2.4vw, 22px);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-size: clamp(.85rem, 1.6vw, .98rem);
    font-weight:500;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(93,109,163,.18);
    transition: background .35s ease, box-shadow .35s ease, transform .25s ease, color .35s ease;
    white-space:nowrap;
  }
  .glass-btn:hover, .glass-btn:focus-visible{
    background: linear-gradient(120deg, rgba(169,215,242,.55), rgba(255,211,230,.55));
    box-shadow: 0 10px 26px rgba(93,109,163,.32);
    transform: translateY(-2px);
    outline:none;
  }
  .glass-btn:active{ transform: translateY(0); }

  /* ============ MODALS ============ */
  .modal{
    position:absolute; inset:0;
    background: rgba(61,53,87,.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .35s ease;
    z-index:10;
    padding: 4vh 4vw;
  }
  .modal.visible{ opacity:1; pointer-events:auto; }
  .modal-inner{
    position:relative;
    width:min(760px, 94vw);
    max-height: 86vh;
    background: var(--pearl);
    border-radius:18px;
    padding: clamp(18px,3vh,28px) clamp(16px,3vw,28px);
    box-shadow: 0 30px 60px rgba(93,109,163,.4);
    display:flex; flex-direction:column;
    transform: scale(.9);
    transition: transform .35s ease;
  }
  .modal.visible .modal-inner{ transform: scale(1); }

  .modal-inner h3{
    font-family:'Parisienne', cursive;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    margin: 0 0 12px 0;
    color: var(--ink);
    text-align:center;
  }

  /* ============ CAROUSEL (fotos completas) ============ */
  .carousel{
    display:flex;
    flex-direction:column;
    gap: 10px;
    min-height:0;
    flex: 1 1 auto;
  }
  .carousel-viewport{
    position:relative;
    width:100%;
    height: clamp(260px, 58vh, 520px);
    flex: none;
    border-radius:16px;
    overflow:hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.7), transparent 55%),
      linear-gradient(150deg, var(--sky-mist), var(--aqua-mist) 55%, var(--lilac-mist));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 26px rgba(93,109,163,.22);
    touch-action: pan-y;
  }
  .carousel-track{
    display:flex;
    height:100%;
    transition: transform .5s cubic-bezier(.22,.8,.24,1);
    will-change: transform;
  }
  .carousel-slide{
    flex: 0 0 100%;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px;
  }
  .carousel-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:10px;
    box-shadow: 0 10px 22px rgba(93,109,163,.28);
    background: rgba(255,255,255,.4);
    user-select:none;
    -webkit-user-drag:none;
  }
  .gallery-fallback{
    width:70%; height:70%;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--sky-mist), var(--lilac-mist));
    color: var(--ink-soft);
    font-size:.8rem;
    text-align:center;
    padding:6px;
  }

  .carousel-btn{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width: clamp(32px, 7vw, 40px);
    height: clamp(32px, 7vw, 40px);
    border-radius:50%;
    border: 1px solid rgba(255,255,255,.75);
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--ink);
    font-size: 1.25rem;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(93,109,163,.25);
    transition: background .25s ease, transform .2s ease;
    z-index:2;
  }
  .carousel-btn:hover, .carousel-btn:focus-visible{
    background: rgba(255,255,255,.85);
    transform: translateY(-50%) scale(1.08);
    outline:none;
  }
  .carousel-btn.prev{ left:10px; }
  .carousel-btn.next{ right:10px; }

  .carousel-toggle{
    position:absolute;
    top:10px; right:10px;
    width:30px; height:30px;
    border-radius:50%;
    border: 1px solid rgba(255,255,255,.75);
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--ink);
    font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(93,109,163,.2);
    z-index:2;
    transition: background .25s ease;
  }
  .carousel-toggle:hover{ background: rgba(255,255,255,.85); }

  .carousel-dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
  }
  .carousel-dot{
    width:8px; height:8px;
    border-radius:50%;
    border:none;
    padding:0;
    background: rgba(111,184,230,.35);
    cursor:pointer;
    transition: width .3s ease, background .3s ease;
  }
  .carousel-dot.active{
    width:22px;
    border-radius:5px;
    background: linear-gradient(90deg, var(--sky-deeper), var(--lilac));
  }

  .gallery-note{
    font-size:.78rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:2px;
  }

  .song-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-align:center;
  }
  .song-thumb-wrap{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 12px 28px rgba(93,109,163,.32);
    background: linear-gradient(135deg, var(--sky-mist), var(--lilac-mist));
  }
  .song-thumb-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .song-play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(61,53,87,.18);
    border:none;
    cursor:pointer;
    transition: background .3s ease;
  }
  .song-play:hover, .song-play:focus-visible{ background: rgba(61,53,87,.32); outline:none; }
  .song-play-icon{
    width: clamp(52px, 10vw, 68px);
    height: clamp(52px, 10vw, 68px);
    border-radius:50%;
    background: rgba(255,255,255,.92);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px rgba(93,109,163,.4);
    transition: transform .25s ease;
  }
  .song-play:hover .song-play-icon{ transform: scale(1.08); }
  .song-play-icon svg{ width:38%; height:38%; margin-left:4%; fill: var(--sky-deep); }
  .song-meta{ line-height:1.3; }
  .song-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(1.05rem, 2.2vw, 1.3rem);
    color: var(--ink);
  }
  .song-artist{
    font-size:.85rem;
    color: var(--ink-soft);
  }
  .song-link{
    margin-top:4px;
    font-size:.82rem;
    color: var(--sky-deep);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition: border-color .25s ease;
  }
  .song-link:hover, .song-link:focus-visible{ border-color: var(--sky-deep); }

  /* ============ ACCESSIBILITY ============ */
  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (prefers-reduced-motion: reduce){
    .bg, .cloud, .fheart, .hint, .envelope, .env-flap, .env-letter-peek,
    .letter-card, .glass-btn, .close-btn, .modal, .modal-inner, .actions{
      animation-duration: .001s !important;
      transition-duration: .2s !important;
    }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="bg" id="bgLayer"></div>
  <div class="bg-texture" aria-hidden="true"></div>
  <div class="cursor-light" id="cursorLight"></div>
  <div class="clouds" id="clouds"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <!-- ENVELOPE VIEW -->
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir el sobre para leer la carta">
      <div class="envelope-glow" aria-hidden="true"></div>
      <div class="env-body"></div>
      <div class="env-letter-peek"></div>
      <div class="env-seam" aria-hidden="true"></div>
      <div class="seal-ribbon" aria-hidden="true"></div>
      <div class="env-flap">
        <div class="seal" aria-hidden="true">
          <div class="seal-half left">♥</div>
          <div class="seal-half right">♥</div>
        </div>
      </div>
    </div>
    <p class="hint" id="hint">Toca el sobre para abrirlo 💌</p>
  </div>

  <!-- LETTER CARD -->
  <section class="letter-card" id="letterCard" aria-hidden="true" aria-label="Carta">
    <span class="ribbon">Para ti</span>
    <button class="close-btn" id="closeLetterBtn" aria-label="Cerrar carta">✕</button>
    <div class="letter-content" id="letterContent">
      <div class="letter-text" id="letterText"></div>
    </div>
    <div class="actions" id="actions">
      <button class="glass-btn" id="galleryBtn"> Fotitos</button>
      <button class="glass-btn" id="songBtn"> Te la dedico</button>
    </div>
  </section>

  <!-- GALLERY MODAL -->
  <div class="modal" id="galleryModal" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
    <div class="modal-inner">
      <button class="close-btn" data-close aria-label="Cerrar galería">✕</button>
      <h3 id="galleryTitle">Fotitos</h3>
      <div class="carousel" id="galleryCarousel">
        <div class="carousel-viewport" id="carouselViewport">
          <div class="carousel-track" id="carouselTrack"></div>
          <button class="carousel-btn prev" id="carouselPrev" aria-label="Foto anterior">‹</button>
          <button class="carousel-btn next" id="carouselNext" aria-label="Foto siguiente">›</button>
          <button class="carousel-toggle" id="carouselToggle" aria-label="Pausar avance automático">⏸</button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
      <p class="gallery-note" id="carouselCounter">Nuestros recuerditos ♥</p>
    </div>
  </div>

  <!-- SONG MODAL -->
  <div class="modal" id="songModal" role="dialog" aria-modal="true" aria-labelledby="songTitle">
    <div class="modal-inner">
      <button class="close-btn" data-close aria-label="Cerrar canción">✕</button>
      <h3 id="songTitle">Musiquita</h3>
      <div class="song-card" id="songCard">
        <div class="song-thumb-wrap">
          <img id="songThumb" alt="Portada de la canción" loading="eager">
          <button class="song-play" id="songPlayBtn" aria-label="Reproducir en YouTube">
            <span class="song-play-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </button>
        </div>
        <div class="song-meta">
          <div class="song-title">La Que Me Gusta (Versión Acústica)</div>
          <div class="song-artist">Los Amigos Invisibles</div>
        </div>
        <a class="song-link" id="songLink" href="#" target="_blank" rel="noopener">Escuchar en YouTube ↗</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- viewport height fix (mobile browser chrome) ---------- */
  function setVH(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);

  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- cursor / touch light + hue shift ---------- */
  var root = document.documentElement;
  var lastPointerUpdate = 0;
  function updatePointer(x, y){
    var now = performance.now();
    if(now - lastPointerUpdate < 16) return; // ~60fps throttle
    lastPointerUpdate = now;
    var w = window.innerWidth, h = window.innerHeight;
    root.style.setProperty('--mx', x + 'px');
    root.style.setProperty('--my', y + 'px');
    var hue = ((x / w) - 0.5) * 16; // -8deg .. 8deg
    root.style.setProperty('--hue', hue.toFixed(2) + 'deg');
    spawnSparkle(x, y);
  }
  window.addEventListener('mousemove', function(e){ updatePointer(e.clientX, e.clientY); }, { passive:true });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });

  /* ---------- parallax on envelope / letter ---------- */
  var envelope = document.getElementById('envelope');
  var envelopeWrap = document.getElementById('envelopeWrap');
  if(!prefersReducedMotion){
    window.addEventListener('mousemove', function(e){
      var w = window.innerWidth, h = window.innerHeight;
      var dx = (e.clientX / w - 0.5) * 10;
      var dy = (e.clientY / h - 0.5) * 8;
      envelope.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    }, { passive:true });
  }

  /* ---------- clouds ---------- */
  var cloudsHost = document.getElementById('clouds');
  var cloudDefs = [
    { w: 180, top: '12%', left: '8%', dur: 30 },
    { w: 240, top: '68%', left: '70%', dur: 38 },
    { w: 150, top: '30%', left: '78%', dur: 26 },
    { w: 200, top: '78%', left: '18%', dur: 34 }
  ];
  cloudDefs.forEach(function(c){
    var el = document.createElement('div');
    el.className = 'cloud';
    el.style.width = c.w + 'px';
    el.style.height = (c.w * 0.55) + 'px';
    el.style.top = c.top;
    el.style.left = c.left;
    el.style.animationDuration = c.dur + 's';
    cloudsHost.appendChild(el);
  });

  /* ---------- floating hearts (css) ---------- */
  var heartsHost = document.getElementById('floatingHearts');
  if(!prefersReducedMotion){
    var HEART_COUNT = window.innerWidth < 700 ? 9 : 15;
    for(var i=0;i<HEART_COUNT;i++){
      var h = document.createElement('div');
      h.className = 'fheart';
      h.textContent = '♥';
      var size = 10 + Math.random()*18;
      h.style.fontSize = size + 'px';
      h.style.left = (Math.random()*100) + '%';
      h.style.setProperty('--drift', (Math.random()*80-40) + 'px');
      h.style.animationDuration = (14 + Math.random()*12) + 's';
      h.style.animationDelay = (Math.random()*14) + 's';
      heartsHost.appendChild(h);
    }
  }

  /* ---------- canvas: twinkling stars + sparkle particles ---------- */
  var canvas = document.getElementById('particle-canvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var stars = [];
  var sparkles = [];
  var W, H;

  function resizeCanvas(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    initStars();
  }
  function initStars(){
    var count = W < 700 ? 40 : 70;
    stars = [];
    for(var i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.4 + 0.4,
        phase: Math.random()*Math.PI*2,
        speed: 0.4 + Math.random()*0.8
      });
    }
  }
  function spawnSparkle(x, y){
    if(prefersReducedMotion) return;
    if(sparkles.length > 60) return;
    for(var i=0;i<2;i++){
      sparkles.push({
        x: x, y: y,
        vx: (Math.random()-0.5)*1.2,
        vy: -0.4 - Math.random()*0.8,
        r: 1 + Math.random()*2,
        life: 1
      });
    }
  }
  var lastTime = performance.now();
  function tick(now){
    var dt = Math.min((now - lastTime)/1000, 0.05);
    lastTime = now;
    ctx.clearRect(0,0,W,H);

    // stars
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      s.phase += dt * s.speed;
      var alpha = 0.35 + Math.sin(s.phase)*0.35;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0,alpha) + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // sparkles
    for(var j = sparkles.length-1; j>=0; j--){
      var p = sparkles[j];
      p.x += p.vx; p.y += p.vy; p.life -= dt*1.1;
      if(p.life <= 0){ sparkles.splice(j,1); continue; }
      var grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      grad.addColorStop(0, 'rgba(255,255,255,' + p.life + ')');
      grad.addColorStop(1, 'rgba(169,215,242,0)');
      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, p.r*4, 0, Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(tick);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(tick);

  /* ---------- letter content ---------- */
  var letterParagraphs = [
    "Hola, nena,",
    "Hoy que es el Día de la Novia no quería dejar pasar el día sin escribirte esto. Me encantaría estar a tu lado para compartir un momento juntos, pero aunque mi recuperación me tenga un poco lejos en lo físico, quería estar presente de esta manera.",
    "Quería decirte algo que a veces las palabras no alcanzan a explicar del todo: me estás enseñando a amar de una manera totalmente distinta. Contigo he aprendido lo valiosa que es la paciencia, lo importante que es escucharnos y cómo la comunicación transparente va construyendo algo muy bonito entre los dos. Todos los días aprendemos el uno del otro, y ese crecimiento mutuo es de las cosas que más valoro de lo que compartimos.",
    "Tengo que confesarte algo... tú sabes muy bien que yo no era así. Eso de tomarme fotos, mandarte videítos o ponerme expresivo no era para nada lo mío. Pero por ti me nace hacerlo. Cada pequeño detalle y cada cambio en mí es porque de verdad me importas muchísimo y quiero mejorar día a día.",
    "No te imaginas cuánto me gustan nuestras videollamadas del día esas que ya se volvieron infaltables y nuestras llamadas en la noche para dormir conversando. Esos momentos se han vuelto mi parte favorita del día.",
    "Me fascina cómo eres, nena. Admiro profundamente tu entrega a Dios, cómo le sirves de corazón en el coro, y esa dedicación que le pones a todo lo que te propones (además de lo linda y arregladita que siempre te ves, con ese estilo tan tuyo que me encanta). Tienes un corazón hermoso.",
    "Le pido a Dios que todo esto siga fluyendo con la misma tranquilidad y bonito proceso con el que ha venido creciendo, hasta que finalmente se dé el momento en que podamos estar juntos y sin distancias de por medio.",
    "Gracias por tu paciencia y por ser esa persona tan especial en mi vida.",
    "Te quiero mucho."
  ];

  var letterTextEl = document.getElementById('letterText');
  var letterContentEl = document.getElementById('letterContent');
  var actionsEl = document.getElementById('actions');
  var typing = false;
  var typingDone = false;
  var typeTimer = null;

  function buildFullTextInstant(){
    letterTextEl.innerHTML = letterParagraphs.map(function(p){
      return '<p>' + escapeHtml(p) + '</p>';
    }).join('');
    typingDone = true;
    showActions();
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function startTypewriter(){
    if(prefersReducedMotion){
      buildFullTextInstant();
      return;
    }
    typing = true;
    typingDone = false;
    letterTextEl.innerHTML = '';
    var pIndex = 0, cIndex = 0;
    var currentP = null;
    var caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▌';

    function step(){
      if(!typing) return; // cancelled (skip)
      if(pIndex >= letterParagraphs.length){
        caret.remove();
        typing = false;
        typingDone = true;
        showActions();
        return;
      }
      if(!currentP){
        currentP = document.createElement('p');
        letterTextEl.appendChild(currentP);
        currentP.appendChild(caret);
      }
      var word = letterParagraphs[pIndex];
      var charsThisTick = 1;
      cIndex += charsThisTick;
      var textSoFar = word.slice(0, cIndex);
      currentP.textContent = textSoFar;
      currentP.appendChild(caret);
      letterContentEl.scrollTop = letterContentEl.scrollHeight;

      if(cIndex >= word.length){
        pIndex++;
        cIndex = 0;
        currentP = null;
      }
      typeTimer = setTimeout(step, 9);
    }
    step();
  }

  function skipTypewriter(){
    if(typingDone) return;
    typing = false;
    if(typeTimer) clearTimeout(typeTimer);
    buildFullTextInstant();
  }

  function showActions(){
    actionsEl.classList.add('visible');
  }

  letterContentEl.addEventListener('click', skipTypewriter);
  letterContentEl.addEventListener('touchstart', function(){}, { passive:true });

  /* ---------- envelope open / letter reveal ---------- */
  var letterCard = document.getElementById('letterCard');
  var closeLetterBtn = document.getElementById('closeLetterBtn');
  var opened = false;

  function openEnvelope(){
    if(opened) return;
    opened = true;
    envelope.classList.add('opening');
    document.getElementById('hint').style.opacity = '0';

    setTimeout(function(){
      envelopeWrap.classList.add('hidden');
      letterCard.classList.add('visible');
      letterCard.setAttribute('aria-hidden', 'false');
      startTypewriter();
      closeLetterBtn.focus();
    }, 650);
  }

  function closeLetter(){
    letterCard.classList.remove('visible');
    letterCard.setAttribute('aria-hidden', 'true');
    actionsEl.classList.remove('visible');
    if(typeTimer) clearTimeout(typeTimer);
    typing = false;
    setTimeout(function(){
      envelope.classList.remove('opening');
      envelopeWrap.classList.remove('hidden');
      opened = false;
      envelope.focus();
    }, 400);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openEnvelope();
    }
  });
  closeLetterBtn.addEventListener('click', closeLetter);

  /* ---------- modals ---------- */
  var galleryModal = document.getElementById('galleryModal');
  var songModal = document.getElementById('songModal');
  var galleryBtn = document.getElementById('galleryBtn');
  var songBtn = document.getElementById('songBtn');
  var YT_ID = 'rigubwkGxdw';
  var YT_URL = 'https://youtu.be/' + YT_ID;
  var PHOTO_EXTENSIONS = ['jpeg', 'jpg', 'png', 'JPEG', 'JPG', 'PNG'];
  var PHOTO_COUNT = 11;

  /* ---------- carousel de fotos ---------- */
  var carouselTrack = document.getElementById('carouselTrack');
  var carouselDots = document.getElementById('carouselDots');
  var carouselPrevBtn = document.getElementById('carouselPrev');
  var carouselNextBtn = document.getElementById('carouselNext');
  var carouselToggleBtn = document.getElementById('carouselToggle');
  var carouselViewport = document.getElementById('carouselViewport');
  var carouselCounter = document.getElementById('carouselCounter');

  var galleryBuilt = false;
  var slideCount = 0;
  var currentSlide = 0;
  var autoplayTimer = null;
  var autoplayMs = 4200;
  var autoplayOn = true;

  function buildGallery(){
    if(galleryBuilt) return;
    galleryBuilt = true;
    for(var i=1;i<=PHOTO_COUNT;i++){
      var slide = document.createElement('div');
      slide.className = 'carousel-slide';
      var img = document.createElement('img');
      img.alt = 'Recuerdo ' + i;
      img.loading = i === 1 ? 'eager' : 'lazy';
      img.dataset.extIndex = '0';
      img.dataset.photoIndex = String(i);
      img.src = 'fotos/foto' + i + '.' + PHOTO_EXTENSIONS[0];
      img.addEventListener('error', function handleImgError(){
        var extIndex = parseInt(this.dataset.extIndex, 10) + 1;
        if(extIndex < PHOTO_EXTENSIONS.length){
          this.dataset.extIndex = String(extIndex);
          this.src = 'fotos/foto' + this.dataset.photoIndex + '.' + PHOTO_EXTENSIONS[extIndex];
        } else {
          var fallback = document.createElement('div');
          fallback.className = 'gallery-fallback';
          fallback.textContent = '♥ Agrega tu foto aquí';
          this.replaceWith(fallback);
        }
      });
      slide.appendChild(img);
      carouselTrack.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'carousel-dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', 'Ir a la foto ' + i);
      dot.addEventListener('click', (function(idx){
        return function(){ goToSlide(idx, true); };
      })(i - 1));
      carouselDots.appendChild(dot);
    }
    slideCount = PHOTO_COUNT;
    updateCarouselUI();
  }

  function updateCarouselUI(){
    carouselTrack.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
    var dots = carouselDots.querySelectorAll('.carousel-dot');
    dots.forEach(function(d, idx){
      d.classList.toggle('active', idx === currentSlide);
    });
    if(carouselCounter){
      carouselCounter.textContent = (currentSlide + 1) + ' / ' + slideCount;
    }
  }

  function goToSlide(index, userTriggered){
    if(slideCount === 0) return;
    currentSlide = (index + slideCount) % slideCount;
    updateCarouselUI();
    if(userTriggered) restartAutoplay();
  }
  function nextSlide(userTriggered){ goToSlide(currentSlide + 1, userTriggered); }
  function prevSlide(userTriggered){ goToSlide(currentSlide - 1, userTriggered); }

  function startAutoplay(){
    stopAutoplay();
    if(!autoplayOn || prefersReducedMotion) return;
    autoplayTimer = setInterval(function(){ nextSlide(false); }, autoplayMs);
  }
  function stopAutoplay(){
    if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; }
  }
  function restartAutoplay(){
    if(autoplayOn) startAutoplay();
  }

  carouselPrevBtn.addEventListener('click', function(){ prevSlide(true); });
  carouselNextBtn.addEventListener('click', function(){ nextSlide(true); });
  carouselToggleBtn.addEventListener('click', function(){
    autoplayOn = !autoplayOn;
    carouselToggleBtn.textContent = autoplayOn ? '⏸' : '▶';
    carouselToggleBtn.setAttribute('aria-label', autoplayOn ? 'Pausar avance automático' : 'Reanudar avance automático');
    if(autoplayOn) startAutoplay(); else stopAutoplay();
  });

  /* deslizar con el dedo (touch) o el mouse */
  (function(){
    var startX = 0, deltaX = 0, dragging = false;
    function onStart(x){ dragging = true; startX = x; deltaX = 0; stopAutoplay(); }
    function onMove(x){ if(!dragging) return; deltaX = x - startX; }
    function onEnd(){
      if(!dragging) return;
      dragging = false;
      var threshold = 40;
      if(deltaX > threshold) prevSlide(true);
      else if(deltaX < -threshold) nextSlide(true);
      else restartAutoplay();
    }
    carouselViewport.addEventListener('touchstart', function(e){
      if(e.touches && e.touches[0]) onStart(e.touches[0].clientX);
    }, { passive:true });
    carouselViewport.addEventListener('touchmove', function(e){
      if(e.touches && e.touches[0]) onMove(e.touches[0].clientX);
    }, { passive:true });
    carouselViewport.addEventListener('touchend', onEnd);
  })();

  function openModal(modal){
    modal.classList.add('visible');
    var closeBtn = modal.querySelector('[data-close]');
    if(closeBtn) closeBtn.focus();
  }
  function closeModal(modal){
    modal.classList.remove('visible');
    if(modal === galleryModal) stopAutoplay();
  }

  galleryBtn.addEventListener('click', function(){
    buildGallery();
    openModal(galleryModal);
    restartAutoplay();
  });

  document.addEventListener('keydown', function(e){
    if(!galleryModal.classList.contains('visible')) return;
    if(e.key === 'ArrowLeft') prevSlide(true);
    else if(e.key === 'ArrowRight') nextSlide(true);
  });

  /* song: link out to YouTube instead of embedding (embedding is often
     blocked by the video owner and by local file:// pages) */
  var songThumb = document.getElementById('songThumb');
  var songLink = document.getElementById('songLink');
  var songPlayBtn = document.getElementById('songPlayBtn');
  var THUMB_QUALITIES = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];
  songThumb.dataset.qIndex = '0';
  songThumb.src = 'https://img.youtube.com/vi/' + YT_ID + '/' + THUMB_QUALITIES[0] + '.jpg';
  songThumb.addEventListener('error', function(){
    var qIndex = parseInt(this.dataset.qIndex, 10) + 1;
    if(qIndex < THUMB_QUALITIES.length){
      this.dataset.qIndex = String(qIndex);
      this.src = 'https://img.youtube.com/vi/' + YT_ID + '/' + THUMB_QUALITIES[qIndex] + '.jpg';
    }
  });
  songLink.href = YT_URL;
  songPlayBtn.addEventListener('click', function(){
    window.open(YT_URL, '_blank', 'noopener');
  });

  songBtn.addEventListener('click', function(){
    openModal(songModal);
  });

  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', function(){
      closeModal(btn.closest('.modal'));
    });
  });
  [galleryModal, songModal].forEach(function(modal){
    modal.addEventListener('click', function(e){
      if(e.target === modal) closeModal(modal);
    });
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(galleryModal.classList.contains('visible')) closeModal(galleryModal);
    else if(songModal.classList.contains('visible')) closeModal(songModal);
    else if(opened) closeLetter();
  });

})();
</script>
</body>
</html>
